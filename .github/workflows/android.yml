name: Android CI
concurrency:
  group: aura-android-${{ github.ref }}
  cancel-in-progress: true
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"
      - name: Run unit tests
        run: gradle testDebugUnitTest --no-daemon
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Verify packaged hand model
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/generated/auraAssets/hand_landmarker.task
          stat -c '%s %n' app/build/generated/auraAssets/hand_landmarker.task
          sha256sum app/build/generated/auraAssets/hand_landmarker.task
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          if "$ANDROID_HOME/build-tools/36.0.0/aapt" dump permissions app/build/outputs/apk/debug/app-debug.apk | grep -q "android.permission.INTERNET"; then
            echo "AURA APK must not request INTERNET permission"
            exit 1
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
